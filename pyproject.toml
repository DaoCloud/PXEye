[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pxeye"
version = "0.22.15"
description = "A visual operations console for NVIDIA Infra Controller"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["ruff==0.14.3"]

[project.scripts]
pxeye = "pxeye.__main__:main"
pxeye-sync-certificates = "pxeye.clients.certificate_sync:main"
pxeye-bootstrap-vault = "pxeye.deployment.vault_bootstrap:main"
pxeye-render-nico = "pxeye.deployment.renderer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pxeye = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "web/*.xlsx", "web/shared/*.js", "web/pages/*.js", "web/icons/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/*.py" = ["F401"]
