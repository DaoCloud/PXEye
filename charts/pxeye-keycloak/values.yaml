# This Chart intentionally creates no credentials. All credentials and the realm
# import are supplied by existing Secrets or ConfigMaps owned by the site setup.
replicaCount: 1

image:
  repository: quay.io/keycloak/keycloak
  tag: "24.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8082
  targetPort: 8080
  annotations: {}

# The image's normal entrypoint is retained when command is empty. A site must
# explicitly provide production-appropriate arguments, for example
# ["start", "--import-realm", "--http-enabled=true"]. The legacy start-dev
# mode is deliberately not a default of this Chart.
startup:
  command: []
  args: []

admin:
  existingSecret: ""
  usernameKey: username
  passwordKey: password

database:
  vendor: postgres
  # Example: jdbc:postgresql://postgres.nico-rest.svc:5432/keycloak?sslmode=require
  url: ""
  existingSecret: ""
  usernameKey: username
  passwordKey: password

# Supply exactly one existing source. Use a Secret when the realm JSON contains
# client secrets; a ConfigMap is appropriate only for non-sensitive realm data.
realm:
  existingConfigMap: ""
  existingSecret: ""
  key: nico-realm.json
  mountPath: /opt/keycloak/data/import

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30

# Additional Keycloak environment variables, supplied as Kubernetes EnvVar
# objects. Do not put credentials here; reference an existing Secret instead.
extraEnv: []
