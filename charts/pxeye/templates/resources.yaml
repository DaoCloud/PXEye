{{- if .Values.components.pxeye.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-nico-installer
  namespace: {{ .Release.Namespace }}
rules:
{{- if .Values.readOnly }}
# A read-only observer only watches workloads; it receives no installer rights and no Secret access here.
- apiGroups: ['']
  resources: [pods, services, persistentvolumeclaims]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets]
  verbs: [get, list, watch]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch]
- apiGroups: [cert-manager.io]
  resources: [certificates]
  verbs: [get, list, watch]
{{- else }}
- apiGroups:
  - ''
  resources:
  - services
  - configmaps
  - secrets
  - persistentvolumeclaims
  - serviceaccounts
  - pods
  - endpoints
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - bind
  - escalate
- apiGroups:
  - cert-manager.io
  resources:
  - certificates
  - certificaterequests
  - issuers
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  - ingresses
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-nico-installer
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-nico-installer
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
---
{{- if not .Values.sharedStorage.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-storage
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
  - {{ .Values.sharedStorage.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.sharedStorage.size | quote }}
  {{- with .Values.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/site-config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        pxeye.io/storage-owner: {{ .Release.Name | quote }}
    spec:
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  pxeye.io/storage-reader: {{ default (printf "%s-storage" .Release.Name) .Values.sharedStorage.existingClaim | quote }}
              topologyKey: kubernetes.io/hostname
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: initialize-storage
        image: {{ required "Set image to the PXEye image reference" .Values.image | quote }}
        imagePullPolicy: IfNotPresent
        command: [python3, /storage-init/initialize-storage.py]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: '1', memory: 128Mi}
        volumeMounts:
        - {name: storage, mountPath: /storage}
        - {name: storage-init, mountPath: /storage-init, readOnly: true}
        - {name: config, mountPath: /config, readOnly: true}
      containers:
      - name: pxeye
        image: {{ required "Set image to the PXEye image reference" .Values.image | quote }}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - name: storage
          mountPath: /data
          subPath: data
        - name: config
          mountPath: /config
          readOnly: true
        - name: secrets
          mountPath: /secrets
          readOnly: true
        {{- with (.Values.siteCredentials | default dict).existingSecret }}
        - name: site-credential-input
          mountPath: /site-credential-input
          readOnly: true
        {{- end }}
        - name: storage
          mountPath: /materials
          subPath: http/nico/os-library
        - name: storage
          mountPath: /iso-sources
          subPath: iso-sources
        - name: storage
          mountPath: /staging
          subPath: staging
        - name: temporary
          mountPath: /tmp
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: {{ default (printf "%s-storage" .Release.Name) .Values.sharedStorage.existingClaim | quote }}
      - name: storage-init
        configMap:
          name: {{ .Release.Name }}-storage-init
      - name: config
        configMap:
          name: {{ .Release.Name }}
      - name: secrets
        secret:
          secretName: '{{ default .Release.Name .Values.auth.existingSecret }}'
          defaultMode: 288
      {{- with (.Values.siteCredentials | default dict).existingSecret }}
      - name: site-credential-input
        secret:
          secretName: {{ . | quote }}
          optional: true
          defaultMode: 288
      {{- end }}
      - name: temporary
        emptyDir:
          sizeLimit: 256Mi
      nodeSelector: {{ .Values.nodeSelector | toJson }}
      imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: '{{ .Values.service.type }}'
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    {{- if eq .Values.service.type "NodePort" }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
{{- end }}
