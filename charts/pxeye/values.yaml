image: 127.0.0.1:1027/pxeye:0.22.16-7acbfa2-20261117T054943Z-51c9e035
storageClass: ''
# Shared by PXEye (read/write) and NICo PXE (HTTP subtree, read-only).
# RWO requires same-node multi-Pod support; PXE follows PXEye using Pod affinity.
sharedStorage:
  size: 200Gi
  accessMode: ReadWriteOnce
  existingClaim: ''
service:
  type: NodePort
  port: 80
  nodePort: 31808
auth:
  existingSecret: ''
nodeSelector: {}
imagePullSecrets: []
nico:
  enabled: true
  allowClusterResources: false
# A one-command offline installation enables this only after fixing the
# cluster-local Core endpoint and Secret names.  It never supplies physical
# PXE/DNS/NTP addresses; those remain an explicit site-network action.
siteBootstrap:
  enabled: false
  siteName: PXEye
  coreUrl: ''
  namespace: ''
  clientSecret: ''
  clientCertKey: tls.crt
  clientPrivateKey: tls.key
  caSecret: ''
  caKey: tls.crt
  pxeInternalUrl: ''
# Kubernetes namespace that owns NICo DHCP/PXE/DNS/NTP runtime resources.
# This is a deployment target, not a physical-network parameter.  Empty means
# the PXEye release namespace.  Set it only when PXEye is intentionally
# installed in another namespace.
siteBootNetwork:
  namespace: nico-system
components:
  pxeye:
    enabled: true
  certManager:
    enabled: false
  platform:
    enabled: false
  vaultBootstrap:
    enabled: false
  core:
    enabled: false
  # Independent boot/DPU material publishing is intentionally disabled in the
  # first umbrella delivery. It is not part of the current image-only POC.
  materials:
    enabled: false
  rest:
    enabled: false
  siteagent:
    enabled: false
  temporal:
    enabled: false
  keycloak:
    enabled: false
rest:
  nico-rest-common:
    secrets:
      create: false
  nico-rest-api:
    image: {offlineReference: 'docker.io/nico-local/nico-rest-api:e703126e4'}
  nico-rest-cert-manager:
    image: {offlineReference: 'docker.io/nico-local/nico-rest-cert-manager:e703126e4'}
  nico-rest-db:
    image: {offlineReference: 'docker.io/nico-local/nico-rest-db:e703126e4'}
    waitForPostgres: {image: 'docker.io/library/postgres:14.4-alpine'}
  nico-rest-site-manager:
    image: {offlineReference: 'docker.io/nico-local/nico-rest-site-manager:e703126e4'}
    rbac: {create: false}
  nico-rest-workflow:
    image: {offlineReference: 'docker.io/nico-local/nico-rest-workflow:e703126e4'}
siteagent:
  image: {offlineReference: 'docker.io/nico-local/nico-rest-site-agent:e703126e4'}
  bootstrap: {enabled: false, image: 'docker.io/alpine/k8s:1.29.4'}
  envConfig: {CORE_GRPC_SEC_OPT: '2', FLOW_GRPC_ENABLED: 'false'}
temporal:
  server:
    image: {repository: m.daocloud.io/docker.io/temporalio/server, tag: '1.26.2'}
  admintools:
    enabled: true
    image: {repository: m.daocloud.io/docker.io/temporalio/admin-tools, tag: '1.26.2'}
  web: {enabled: false}
  cassandra: {enabled: false}
  elasticsearch: {enabled: false, external: false}
  prometheus: {enabled: false}
  grafana: {enabled: false}
  schema: {setup: {enabled: true}, update: {enabled: true}}
keycloak:
  image: {repository: m.daocloud.io/quay.io/keycloak/keycloak, tag: '24.0'}
