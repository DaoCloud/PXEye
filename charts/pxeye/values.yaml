image: 10.20.1.50:1027/pxeye:0.22.16-202611202155-d06ee64
storageClass: ''
# Shared by PXEye (read/write) and NICo PXE (HTTP subtree, read-only).
# RWO requires same-node multi-Pod support; PXE follows PXEye using Pod affinity.
sharedStorage:
  size: 200Gi
  accessMode: ReadWriteOnce
  existingClaim: ''
# Read-only observer: a second console on a Core that another PXEye operates.
# It rejects every command except sign-in and sends only reads to Core and BMCs.
readOnly: false
# Preview: per-kind device pages (servers, switches, power shelves) with the
# operational state NICo Core reports. Off keeps the navigation and API as before.
rackOperations: false
# Preview: NICo-native operations (power, maintenance, quarantine, rack maintenance)
# on top of rackOperations. Effective only with rackOperations on and readOnly off.
rackActions: false
service:
  type: NodePort
  port: 80
  nodePort: 31808
auth:
  existingSecret: ''
nodeSelector: {}
imagePullSecrets: []
nico:
  enabled: true
  allowClusterResources: false
# A one-command offline installation enables this only after fixing the
# cluster-local Core endpoint and Secret names.  It never supplies physical
# PXE/DNS/NTP addresses; those remain an explicit site-network action.
siteBootstrap:
  enabled: false
  siteName: PXEye
  coreUrl: ''
  namespace: ''
  clientSecret: ''
  clientCertKey: tls.crt
  clientPrivateKey: tls.key
  caSecret: ''
  caKey: tls.crt
  # Optional SiteAgent identity used only after an operator confirms creation
  # of the site's default Tenant and Flat VPC.
  siteInitializerSecret: ''
  pxeInternalUrl: ''
siteCredentials:
  newSite: false
  existingSecret: ''
# Kubernetes namespace that owns NICo DHCP/PXE/DNS/NTP runtime resources.
# This is a deployment target, not a physical-network parameter.  Empty means
# the PXEye release namespace.  Set it only when PXEye is intentionally
# installed in another namespace.
siteBootNetwork:
  namespace: nico-system
components:
  pxeye:
    enabled: true
  certManager:
    enabled: false
  platform:
    enabled: false
  vaultBootstrap:
    enabled: false
  core:
    enabled: false
  # Independent boot/DPU material publishing is intentionally disabled in the
  # first umbrella delivery. It is not part of the current image-only POC.
  materials:
    enabled: false
  rest:
    enabled: false
  siteagent:
    enabled: false
  temporal:
    enabled: false
  keycloak:
    enabled: false
  flow:
    enabled: false
  rms:
    enabled: false
managementReleases:
  rest: {name: nico-rest, namespace: nico-rest}
  siteagent: {name: nico-rest-site-agent, namespace: nico-rest}
  temporal: {name: temporal, namespace: temporal}
  keycloak: {name: nico-keycloak, namespace: nico-rest}
  # The Site Agent reaches Flow at flow.flow.svc.cluster.local:50051 and Core reaches RMS at
  # rms-api-server.rack-manager.svc.cluster.local:8801, so these two names and namespaces are fixed.
  flow: {name: flow, namespace: flow}
  rms: {name: rack, namespace: rack-manager}
rest:
  nico-rest-common:
    secrets:
      create: false
  nico-rest-api:
    image: {offlineReference: 'docker.io/nico-local/nico-rest-api:28e4e9824'}
  nico-rest-cert-manager:
    image: {offlineReference: 'docker.io/nico-local/nico-rest-cert-manager:28e4e9824'}
  nico-rest-db:
    image: {offlineReference: 'docker.io/nico-local/nico-rest-db:28e4e9824'}
    waitForPostgres: {image: 'docker.io/library/postgres:14.4-alpine'}
  nico-rest-site-manager:
    image: {offlineReference: 'docker.io/nico-local/nico-rest-site-manager:28e4e9824'}
    rbac: {create: false}
  nico-rest-workflow:
    image: {offlineReference: 'docker.io/nico-local/nico-rest-workflow:28e4e9824'}
siteagent:
  nameOverride: nico-rest-site-agent
  image: {offlineReference: 'docker.io/nico-local/nico-rest-site-agent:28e4e9824'}
  bootstrap:
    enabled: false
    image: 'docker.io/alpine/k8s:1.29.4'
    siteManager: {address: 'nico-rest-site-manager.nico-rest:8100'}
  envConfig: {CORE_GRPC_SEC_OPT: '2', FLOW_GRPC_ENABLED: 'false'}
temporal:
  server:
    image: {repository: m.daocloud.io/docker.io/temporalio/server, tag: '1.26.2'}
  admintools:
    enabled: true
    image: {repository: m.daocloud.io/docker.io/temporalio/admin-tools, tag: '1.26.2'}
  web: {enabled: false}
  cassandra: {enabled: false}
  elasticsearch: {enabled: false, external: false}
  prometheus: {enabled: false}
  grafana: {enabled: false}
  schema: {setup: {enabled: true}, update: {enabled: true}}
keycloak:
  fullnameOverride: nico-keycloak
  service: {nameOverride: keycloak}
  image: {repository: m.daocloud.io/quay.io/keycloak/keycloak, tag: '24.0'}
# NICo Flow and the REST images must be built from the same NICo source commit as the Core image.
flow:
  images:
    flow: {repository: docker.io/nico-local/nico-flow, tag: '28e4e9824'}
# Upstream helm-prereqs/values/rms.yaml, with the images bound to this delivery. The certificate
# issuer and the database are site prerequisites; see files/management/README.md.
rms:
  namespace: rack-manager
  createNamespace: false
  certificates:
    enabled: true
    issuerRef: {name: vault-nico-issuer, kind: ClusterIssuer}
    duration: 8760h0m0s
    renewBefore: 720h0m0s
  apiServer:
    image: {repository: docker.io/nico-local/rms-api, tag: '5db9c6b'}
    tls: {enabled: true, caEnabled: true}
    serviceMonitor: {enabled: false}
  databaseMode: external
  database:
    host: nico-pg-cluster.postgres.svc.cluster.local
    port: '5432'
    name: rms
    credentialsSecret: rms.nico.nico-pg-cluster.credentials
  dropDatabaseOnUninstall: false
  grafana: {dashboard: {enabled: false}}
