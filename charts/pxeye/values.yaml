image: '127.0.0.1:1027/pxeye:0.22.16-2edc182'
storageClass: ''
dataStorage: 2Gi
materialsStorage: 50Gi
service:
  type: NodePort
  port: 80
  nodePort: 31808
auth:
  existingSecret: ''
nodeSelector: {}
imagePullSecrets: []
nico:
  enabled: true
  allowClusterResources: false
# A one-command offline installation enables this only after fixing the
# cluster-local Core endpoint and Secret names.  It never supplies physical
# PXE/DNS/NTP addresses; those remain an explicit site-network action.
siteBootstrap:
  enabled: false
  siteName: PXEye
  coreUrl: ''
  namespace: ''
  clientSecret: ''
  clientCertKey: tls.crt
  clientPrivateKey: tls.key
  caSecret: ''
  caKey: tls.crt
  pxeInternalUrl: ''
components:
  pxeye:
    enabled: true
  certManager:
    enabled: false
  platform:
    enabled: false
  vaultBootstrap:
    enabled: false
  core:
    enabled: false
  # Independent boot/DPU material publishing is intentionally disabled in the
  # first umbrella delivery. It is not part of the current image-only POC.
  materials:
    enabled: false
