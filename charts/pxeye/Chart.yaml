apiVersion: v2
name: pxeye
version: 0.1.1
type: application
description: PXEye web console with persistent data, material storage and NICo installer permissions
dependencies:
  - name: cert-manager
    alias: certmanager
    version: v1.17.1
    repository: file://dependencies/cert-manager
    condition: components.certManager.enabled
  - name: pxeye-nico-platform
    alias: platform
    version: 0.1.0
    repository: file://dependencies/platform
    condition: components.platform.enabled
  - name: pxeye-nico-platform
    alias: vaultBootstrap
    version: 0.1.0
    repository: file://dependencies/vault-bootstrap
    condition: components.vaultBootstrap.enabled
  - name: nico
    alias: nicoCore
    version: 0.1.1
    repository: file://dependencies/nico
    condition: components.core.enabled
  - name: nico-materials
    alias: materials
    version: 0.1.0
    repository: file://dependencies/materials
    condition: components.materials.enabled
  - name: nico-rest
    alias: rest
    version: 0.1.13
    repository: file://dependencies/nico-rest
    condition: components.rest.enabled
  - name: nico-rest-site-agent
    alias: siteagent
    version: 0.1.9
    repository: file://dependencies/nico-rest-site-agent
    condition: components.siteagent.enabled
  - name: temporal
    version: 0.35.0
    repository: file://dependencies/temporal
    condition: components.temporal.enabled
  - name: pxeye-keycloak
    alias: keycloak
    version: 0.1.0
    repository: file://dependencies/pxeye-keycloak
    condition: components.keycloak.enabled
