apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pxeye-data
  namespace: pxeye
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pxeye-materials
  namespace: pxeye
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pxeye
  namespace: pxeye
  labels:
    app.kubernetes.io/name: pxeye
    app.kubernetes.io/instance: pxeye
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: pxeye
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pxeye
        app.kubernetes.io/instance: pxeye
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pxeye
          image: pxeye:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: materials
              mountPath: /materials
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pxeye-data
        - name: config
          configMap:
            name: pxeye
        - name: secrets
          secret:
            secretName: pxeye
            defaultMode: 0440
        - name: materials
          persistentVolumeClaim:
            claimName: pxeye-materials
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pxeye
  namespace: pxeye
  labels:
    app.kubernetes.io/name: pxeye
    app.kubernetes.io/instance: pxeye
spec:
  selector:
    app.kubernetes.io/instance: pxeye
  ports:
    - name: http
      port: 80
      targetPort: http
