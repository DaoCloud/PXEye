apiVersion: v1
kind: Namespace
metadata:
  name: mmzhou
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mmzhou-pxeye
  namespace: mmzhou
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mmzhou-pxeye-nico-installer
  namespace: mmzhou
rules:
  - apiGroups: [""]
    resources: [services, configmaps, secrets, persistentvolumeclaims, serviceaccounts, pods, endpoints, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, bind, escalate]
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests, issuers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mmzhou-pxeye-nico-installer
  namespace: mmzhou
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mmzhou-pxeye-nico-installer
subjects:
  - kind: ServiceAccount
    name: mmzhou-pxeye
    namespace: mmzhou
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mmzhou-pxeye-data
  namespace: mmzhou
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mmzhou-pxeye-materials
  namespace: mmzhou
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 50Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmzhou-pxeye
  namespace: mmzhou
  labels:
    app.kubernetes.io/instance: mmzhou-pxeye
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: mmzhou-pxeye}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: mmzhou-pxeye}
    spec:
      serviceAccountName: mmzhou-pxeye
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pxeye
          image: pxeye:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: POD_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: materials, mountPath: /materials}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mmzhou-pxeye-data}
        - name: config
          configMap: {name: mmzhou-pxeye}
        - name: secrets
          secret: {secretName: mmzhou-pxeye, defaultMode: 0440}
        - name: materials
          persistentVolumeClaim: {claimName: mmzhou-pxeye-materials}
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mmzhou-pxeye
  namespace: mmzhou
spec:
  type: NodePort
  selector: {app.kubernetes.io/instance: mmzhou-pxeye}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 31808}
