# Fireseed example: PXEye and NICo Helm both run in nico-system.
# Keep this namespaced Role/RoleBinding in sync with bootstrap-kubernetes.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nico-system-pxeye-nico-installer
  namespace: nico-system
rules:
  - apiGroups: [""]
    resources: [services, configmaps, secrets, persistentvolumeclaims, serviceaccounts, pods, endpoints, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, bind, escalate]
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests, issuers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nico-system-pxeye-nico-installer
  namespace: nico-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nico-system-pxeye-nico-installer
subjects:
  - kind: ServiceAccount
    name: nico-system-pxeye
    namespace: nico-system
