<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>PXEye · 整机柜运维前端设计稿</title>
    <!-- 直接引用产品的样式文件，设计稿不带副本，也不修改它们 -->
    <link rel="stylesheet" href="../../../src/pxeye/web/styles.css" />
    <link rel="stylesheet" href="../../../src/pxeye/web/live.css" />
    <link rel="stylesheet" href="../../../src/pxeye/web/nico.css" />
    <!-- 设计稿新增的样式：新组件与标注层 -->
    <link rel="stylesheet" href="design.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#racks"
          ><span class="brand-mark"><img src="../../../src/pxeye/web/pxeye.svg" alt="" /></span
          ><span>PXEye<span class="brand-caption">NICo 整机柜驾驶舱</span></span></a
        >
        <div class="workspace">
          <span class="workspace-mark">GB</span>
          <div>演示站点<span id="site-label">GB200 NVL72 · 示例数据</span></div>
          <span class="connection-dot" aria-label="服务连接"></span>
        </div>
        <nav id="navigation"></nav>
        <div class="sidebar-bottom">
          <span class="avatar">OP</span>
          <div>基础设施运维<span id="operator"></span></div>
        </div>
      </aside>
      <div class="workspace-main">
        <header class="topbar">
          <div class="breadcrumb" id="breadcrumb"></div>
          <div class="design-topbar" id="design-topbar"></div>
        </header>
        <main id="main" aria-label="工作区" aria-live="polite"></main>
        <footer class="app-footer"><span>PXEye · See it. Plan it. Boot it.　设计稿：数据均为编写的示例，不连接任何站点。</span></footer>
      </div>
    </div>
    <aside id="guide" class="guide" aria-label="页面说明"></aside>
    <div id="overlay-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
    <script src="contract.js"></script>
    <script src="pages/site.js"></script>
    <script src="pages/network.js"></script>
    <script src="pages/inventory.js"></script>
    <script src="pages/discovery.js"></script>
    <script src="pages/racks.js"></script>
    <script src="pages/rack.js"></script>
    <script src="pages/trays.js"></script>
    <script src="pages/tasks.js"></script>
    <script src="pages/operations.js"></script>
    <script src="pages/health.js"></script>
    <script src="pages/delivery.js"></script>
    <script src="pages/profiles.js"></script>
    <script src="pages/spec.js"></script>
    <script src="main.js"></script>
  </body>
</html>
